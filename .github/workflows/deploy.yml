name: Deploy

# Staging: automatic after CI succeeds on main.
# Production: manual, for a commit that is already deployed to staging,
# gated by the "production" GitHub Environment (required reviewer).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to deploy to production (must be green on staging)
        required: true

permissions:
  contents: read

jobs:
  staging:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: ./.github/actions/deploy
        with:
          environment: staging
          sha: ${{ env.SHA }}
          app-url: ${{ vars.APP_URL }}
          database-url: ${{ secrets.DATABASE_URL }}
          direct-url: ${{ secrets.DIRECT_URL }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

  production:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
      - name: Require the commit to be on main
        run: git merge-base --is-ancestor "${{ inputs.sha }}" origin/main
      - uses: ./.github/actions/deploy
        with:
          environment: production
          sha: ${{ inputs.sha }}
          app-url: ${{ vars.APP_URL }}
          database-url: ${{ secrets.DATABASE_URL }}
          direct-url: ${{ secrets.DIRECT_URL }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          access-client-id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          access-client-secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
