<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Parliament of Ghana</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ECEEF1">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/brand.css">
  <style>
    .nf{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:var(--frame)}
    .nf-copy{padding:64px 56px;display:flex;flex-direction:column;justify-content:center;gap:22px}
    .nf-copy .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
    .nf-band{min-height:420px;display:flex;align-items:flex-end;padding:40px}
    .nf-band b{position:relative;font-size:clamp(96px,14vw,180px);font-weight:300;letter-spacing:-.06em;line-height:.9;color:var(--blue-light)}
    @media (max-width:860px){.nf{grid-template-columns:1fr}.nf-copy{padding:44px 28px}.nf-band{min-height:0;padding:28px}}
  </style>
</head>
<body>
  <header class="panel header">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5"/><path d="M4.5 10h15"/><path d="M6.5 10v7.5M10 10v7.5M14 10v7.5M17.5 10v7.5"/><path d="M4 20h16"/></svg></span>
      <span class="brand-name"><b>Parliament of Ghana</b></span>
    </a>
    <div class="header-cta">
      <a class="btn btn-b" href="/login">Sign in <span class="arr">&rarr;</span></a>
    </div>
  </header>
  <main class="nf">
    <section class="panel nf-copy">
      <span class="cap">Page not found</span>
      <h1>This page isn't here. <span class="muted">Sign in to carry on.</span></h1>
      <p class="lead">The address may be mistyped, or the page may have moved.</p>
      <div class="actions">
        <a class="btn btn-b" href="/login">Go to sign in <span class="arr">&rarr;</span></a>
      </div>
    </section>
    <section class="band nf-band" aria-hidden="true">
      <div class="dotfield"></div>
      <b>404</b>
    </section>
  </main>
  <footer class="panel foot">
    <span>© 2026 Parliament of Ghana · Festival of Nine Lessons and Carols</span>
    
  </footer>
</body>
</html>
